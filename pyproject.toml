[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resilient-httpx"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.0",
    "tenacity>=9.1.0",
    "structlog>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/resilient_httpx"]
